name: daily-scrape
on:
  schedule:
    - cron: '0 3 * * *'        # 毎日 JST12:00
  workflow_dispatch:           # 手動ボタン

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC 認証
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/767225273684/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'scraper-bot@anime-insight-scraper.iam.gserviceaccount.com'   # ←ここは自分の SA ID に置換

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install snscrape gspread google-auth PyYAML requests
      - run: python scrape.py
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
